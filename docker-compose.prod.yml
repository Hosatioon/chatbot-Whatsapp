version: "3.8"

# ============================================================
# MONDRES - Arquitectura de Producción
# ============================================================
#
# ESTE docker-compose es para PRODUCCIÓN con PostgreSQL y Redis.
# Para desarrollo local con SQLite, usa el proyecto directamente.
#
# Servicios:
#   - app:        Next.js (dashboard + API)
#   - bot:        Bot service (WhatsApp Baileys)
#   - postgres:   PostgreSQL (base de datos)
#   - redis:      Redis (caché + rate limiting + queue)
#
# Uso:
#   docker-compose -f docker-compose.prod.yml up -d
#
# ============================================================

services:
  # ------------------------------------------------------------
  # Next.js Application
  # ------------------------------------------------------------
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mondrex-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - ./data:/app/data
      - ./auth:/app/auth
    env_file:
      - .env.production
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://mondrex:CHANGE_ME@postgres:5432/mondrex
      - REDIS_URL=redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M

  # ------------------------------------------------------------
  # Bot Service (WhatsApp Baileys)
  # ------------------------------------------------------------
  bot:
    build:
      context: ./bot-service
      dockerfile: Dockerfile
    container_name: mondrex-bot
    restart: unless-stopped
    ports:
      - "3001:3001"
    volumes:
      - ./bot-service/data:/app/data
      - ./bot-service/auth:/app/auth
    env_file:
      - .env.production
    environment:
      - NODE_ENV=production
      - DATA_DIR=/app/data
      - AUTH_ROOT=/app/auth
      - BOT_PORT=3001
      - DATABASE_URL=postgresql://mondrex:CHANGE_ME@postgres:5432/mondrex
      - REDIS_URL=redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 1.5G
        reservations:
          memory: 512M

  # ------------------------------------------------------------
  # PostgreSQL Database
  # ------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: mondrex-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=mondrex
      - POSTGRES_PASSWORD=CHANGE_ME
      - POSTGRES_DB=mondrex
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mondrex -d mondrex"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  # ------------------------------------------------------------
  # Redis (caché + rate limiting + queue)
  # ------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: mondrex-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M

# ============================================================
# Volumes para persistencia
# ============================================================
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
