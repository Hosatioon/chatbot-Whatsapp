services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: chatbot-web
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - ./data:/app/data
      - ./auth:/app/auth
    env_file:
      - .env.local
    environment:
      - NODE_ENV=production
    depends_on:
      - bot

  bot:
    build:
      context: .
      dockerfile: Dockerfile.bot
    container_name: chatbot-bot
    restart: unless-stopped
    volumes:
      - ./data:/app/data
      - ./auth:/app/auth
    env_file:
      - .env.local
    environment:
      - NODE_ENV=production

