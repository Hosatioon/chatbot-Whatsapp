services:
  redis:
    image: redis:7-alpine
    container_name: ordifast-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1"]
    volumes:
      - ./data/redis:/data
    ports:
      # Solo localhost: la net interna de docker conecta web/bot; exponer esto
      # a 0.0.0.0 dejaba un Redis sin contraseña visible desde internet.
      - "127.0.0.1:6380:6379"

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ordifast-web
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-3000}:3000"
    volumes:
      - ./data:/app/data
      - ./auth:/app/auth
    env_file:
      - .env.local
    environment:
      - NODE_ENV=production
      - REDIS_URL=redis://redis:6379
      # BUG real encontrado (2026-09-11): el contenedor corre en UTC por
      # defecto, y el chequeo de horario de atención (isWithinBusinessHours)
      # usa Date.getHours()/getDay() en hora LOCAL del proceso — sin esto,
      # a las 3pm hora Colombia (que son las 8pm UTC) el bot pensaba que ya
      # habían cerrado (configurado 9am-6pm) y mandaba el mensaje de "fuera
      # de horario" a mitad de la tarde, en pleno horario laboral real.
      # Esto también afecta los cortes de "hoy/esta semana/este mes" en
      # las métricas del dashboard.
      - TZ=America/Bogota
    depends_on:
      - redis
      - bot

  bot:
    build:
      context: .
      dockerfile: Dockerfile.bot
    container_name: ordifast-bot
    restart: unless-stopped
    volumes:
      - ./data:/app/data
      - ./auth:/app/auth
    env_file:
      - .env.local
    environment:
      - NODE_ENV=production
      - REDIS_URL=redis://redis:6379
      # BUG real encontrado (2026-09-11): el contenedor corre en UTC por
      # defecto, y el chequeo de horario de atención (isWithinBusinessHours)
      # usa Date.getHours()/getDay() en hora LOCAL del proceso — sin esto,
      # a las 3pm hora Colombia (que son las 8pm UTC) el bot pensaba que ya
      # habían cerrado (configurado 9am-6pm) y mandaba el mensaje de "fuera
      # de horario" a mitad de la tarde, en pleno horario laboral real.
      # Esto también afecta los cortes de "hoy/esta semana/este mes" en
      # las métricas del dashboard.
      - TZ=America/Bogota
    depends_on:
      - redis
